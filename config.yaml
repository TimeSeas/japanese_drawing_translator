# 日文零件图纸术语自动翻译 - 运行参数
#
# main.py 读这个文件，把 ocr / translator / overlay / logging 四段原样传给
# 对应模块的构造函数，preprocessing 那段逐页传给 preprocess()。
# 相对路径都相对于本文件所在目录解析。

preprocessing:
  grayscale: true           # 灰度化
  denoise: true             # NL-Means 降噪
  denoise_strength: 10      # 降噪强度 1-30，越大越慢
  adaptive_threshold: true  # 自适应二值化，抗光照不均
  binary_block_size: 11     # 二值化块大小，会强制成奇数
  binary_c: 2               # 二值化常数 C
  max_dimension: null       # 超过这个边长先等比缩小；null = 不缩
  deskew: false             # 旋转校正。默认关，原因见 image_processor.py

ocr:
  lang: japan               # PaddleOCR 语言代码，日文写 japan 不写 ja
  min_confidence: 0.5       # 低于这个置信度的识别结果丢掉
  merge_iou_threshold: 0.8  # 重合度超过这个的框合并成一个

translator:
  dictionary_path: dictionary.json
  fuzzy_threshold: 85       # 模糊匹配最低相似度 %。调低多认几个词，也更容易认错
  # 没有假名的行（技術部、正面図、SUS304、縮尺1:2）默认不翻 —— 中文读者
  # 自己就看得懂，盖红字只是添乱。下面这些是例外：纯汉字，但字面像中文、
  # 意思却是另一回事，不翻反而看不懂。按自己的图纸慢慢往里加。
  kanji_traps:
    - 取代      # 中文读"替换"，图纸上是"加工余量"
    - 半田      # 中文不成词，实际是"焊锡"
    - 下穴      # 不是"下面的孔"，是"底孔"
    - 入子      # 不是"放入"，是"镶件"
    - 勾配      # 中文不成词，是"斜度"
    - 座金      # 中文不成词，是"垫圈"
    - 焼入      # 是"淬火"，不是"烧进去"
    - 焼戻      # 是"回火"
    - 焼準      # 是"正火"
    - 焼鈍      # 是"退火"

overlay:
  text_color: [255, 0, 0]          # 译文颜色
  cover_bg_color: [255, 255, 255]  # 遮挡模式的底色
  font_scale_ratio: 0.65           # 译文字号 = 原文框高 × 这个系数。
                                   # 0.8 时中文明显比原文大一圈（汉字是实心方块，
                                   # 同样字高看着比假名重），0.65 视觉上刚好齐平
  min_gap: 3                       # 译文和原文框的最小间距，像素

logging:
  log_dir: logs
  level: INFO               # DEBUG / INFO / WARNING / ERROR
  retention_days: 180

output:
  default_dir: output       # 结果 JSON 的默认落盘位置
  export_dpi: 300           # 导出 PDF 时的分辨率
